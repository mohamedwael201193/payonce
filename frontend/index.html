<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PayOnce — every invoice becomes a payable on Concordium testnet: paid exactly once, only to the account the supplier put on chain. Receipts verify without an account."
    />
    <script>if(location.pathname==="/"){var l=document.createElement("link");l.rel="preload";l.as="image";l.href="/assets/hero-sky.webp";l.setAttribute("fetchpriority","high");document.head.appendChild(l)}</script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PayOnce — Pay each invoice once, on chain (Concordium testnet)</title>
    <style>
      /* First-paint hero: plain HTML + CSS, painted before any script runs. The
         landing replaces it with the same words as soon as it has mounted. */
      #po-boot{position:absolute;top:0;left:0;right:0;z-index:50;min-height:100vh;min-height:100svh;overflow:hidden;color:#fff;font-family:'Inter Tight','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;background:linear-gradient(180deg,#cc2000,#e82a00 30%,#f75a0a 52%,#fa8d37 74%,#f5a56e);transition:opacity .35s ease}
      #po-boot[hidden]{display:none}
      #po-boot .b-nav{display:flex;align-items:center;justify-content:space-between;padding:20px clamp(20px,4vw,56px)}
      #po-boot .b-brand{color:#fff;font-weight:600;font-size:20px;text-decoration:none}
      #po-boot .b-open{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;background:#fff;color:#181914;font-weight:500;font-size:16px;text-decoration:none}
      #po-boot .b-copy{display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(48px,9vw,92px) clamp(20px,4vw,56px) 0}
      #po-boot h1{margin:0;font-weight:500;font-size:clamp(46px,7vw,92px);line-height:1.02;letter-spacing:-.035em;text-shadow:0 2px 30px rgba(110,20,0,.18)}
      #po-boot p{margin:24px 0 0;max-width:30ch;font-size:clamp(17px,1.5vw,20px);line-height:1.45;text-shadow:0 1px 16px rgba(110,20,0,.3)}
      #po-boot .b-cta{margin-top:32px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
      #po-boot .b-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;font-weight:500;font-size:16px;text-decoration:none;border:1px solid transparent}
      #po-boot .b-btn1{background:#fff;color:#181914}
      #po-boot .b-btn2{background:rgba(40,10,0,.3);border-color:rgba(255,255,255,.42);color:#fff}
    </style>
  </head>
  <body>
    <noscript>
      <div style="max-width: 640px; margin: 48px auto; padding: 0 16px; font-family: system-ui, sans-serif; color: #171310;">
        <h1 style="font-size: 24px;">PayOnce needs JavaScript</h1>
        <p style="margin-top: 12px; line-height: 1.5;">
          This page verifies invoices against the Concordium testnet in your browser — it cannot run without
          JavaScript. Turn JavaScript on and reload. Nothing here is a static mockup: every number on the page
          comes from the live test registry.
        </p>
      </div>
    </noscript>
    <div id="po-boot" hidden>
      <div class="b-nav"><a class="b-brand" href="/">PayOnce</a><a class="b-open" href="/app">Open the app</a></div>
      <div class="b-copy">
        <h1>Every invoice,<br />paid once.</h1>
        <p>PayOnce checks each invoice against the chain before any money moves.</p>
        <div class="b-cta"><a class="b-btn b-btn1" href="/app/pay">Pay a live invoice</a><a class="b-btn b-btn2" href="#how">See how it works</a></div>
      </div>
    </div>
    <script>if(location.pathname==='/'){document.getElementById('po-boot').hidden=false}</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
