[package]
name = "payable_registry_v3"
version = "0.1.0"
edition = "2021"
description = "PayOnce payable_registry v3 — Verification of Payee for AI agents (Concordium Trusted Agents hackathon, testnet only). v2.1 + a payee book: payee bound by its own signature over a business-identity proof anchor, chain-enforced cooling-off, buyer acknowledgment. Holds no funds."

[lib]
# cdylib: the deployable wasm module. rlib: lets the integration tests in
# tests/ link the contract's types (plan P1 §6.1 deliverable).
crate-type = ["cdylib", "rlib"]

[dependencies]
concordium-std = "11"

[dev-dependencies]
concordium-smart-contract-testing = "5.0"
concordium-contracts-common = "10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
