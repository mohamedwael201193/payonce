# PayOnce CI (gate G13). No secrets are used or needed: everything here is offline or reads the
# public Concordium testnet node. The live end-to-end test (qa/e2e-live.mjs) and the hosted x402
# settle (qa/x402-settle-live.mjs) need the wallet keys and are run by hand; their evidence is
# committed and re-checked by tests below.
name: payonce-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every push to main gets its own group, so a later push never cancels an earlier main run (HEAD must show a real result).
# Only superseded pull-request runs are cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: secret scan (tree + history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix backend # the BIP-39 wordlist the seed-phrase check uses
      - name: Tree scan (seed phrases, private keys, tokens, .env assignments)
        run: node qa/ci/secrets-scan.mjs .
      - name: History scan (every commit)
        run: node qa/ci/secrets-scan.mjs . --history

  api:
    name: api tests
    runs-on: ubuntu-latest
    steps:
      # `runner.*` is not available in a job-level `env:` (that made the whole workflow invalid, so GitHub
      # started zero jobs). Set it from a step instead.
      - run: echo "PAYONCE_DATA_DIR=$RUNNER_TEMP/payonce-data" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix backend
      - run: npm ci --prefix api
      - name: Unit + handler + seller-key + stats + fresh-id tests (offline, stubbed chain)
        working-directory: api
        run: >
          node --test test/unit.test.mjs test/age-proof.test.mjs test/handlers-payable.test.mjs
          test/handlers-stats.test.mjs test/stats-reconcile.test.mjs test/seller-key.test.mjs
          test/vop-mainnet-census.test.mjs test/census-verify.test.mjs test/vop-anchor.test.mjs test/status.test.mjs test/stats-honesty.test.mjs test/fresh-id.test.mjs test/balance-guard.test.mjs test/verify-command-shapes.test.mjs test/vendor-gate.test.mjs test/open-sellers.test.mjs test/wallet-desk.test.mjs test/payee-proof.test.mjs test/vop.test.mjs test/registry-cards.test.mjs test/dash.test.mjs test/ledger-approvals.test.mjs test/vop-attacks.test.mjs test/wallet-age.test.mjs test/x402-client.test.mjs test/x402-seller.test.mjs test/a2a.test.mjs test/payee-card.test.mjs test/node-retry.test.mjs test/invoice-parse.test.mjs

  agent:
    name: agent + check_payee package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Agent guard, tools, MCP core (offline)
        run: node --test agent/test/*.test.mjs
      - name: check-payee npm package and payonce-mcp bridge (offline)
        run: node --test packages/check-payee/test/*.test.mjs packages/payonce-mcp/test/*.test.mjs

  backend:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      # `runner.*` is not available in a job-level `env:` (that made the whole workflow invalid, so GitHub
      # started zero jobs). Set it from a step instead.
      - run: echo "PAYONCE_DATA_DIR=$RUNNER_TEMP/payonce-data" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix backend
      # easypost.test.mjs and facilitator.test.mjs need the wallet / EasyPost keys at import time and are
      # run locally with keys; everything else runs here. Some tests read the public testnet node, so one
      # retry covers a rate-limited (429) read.
      - name: Backend tests (no keys)
        working-directory: backend
        run: |
          files=$(ls test/*.test.mjs | grep -v -E 'easypost\.test|/facilitator\.test')
          node --test $files || { echo "retrying once (public node rate limit)"; node --test $files; }
      - name: Co-signer decision table
        run: node --test contracts/cosigner/test/decide.test.mjs

  frontend:
    name: frontend tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  contracts:
    name: contracts (cargo-concordium tests)
    runs-on: ubuntu-latest
    # cargo-concordium is installed from crates.io; if that install is unavailable the job reports it
    # instead of blocking the other gates. The contract test logs (80 v2 / 83 v2.1) are committed in contracts/.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          targets: wasm32-unknown-unknown, wasm32v1-none
      - name: Install cargo-concordium 5.0.0
        run: cargo install cargo-concordium --version 5.0.0 --locked
      - name: v2 registry tests
        run: cargo concordium test --out out/payable_registry_v2.wasm.v1
        working-directory: contracts/payable_registry_v2
      - name: v2.1 registry tests
        run: cargo concordium test --out out/payable_registry_v2_1.wasm.v1
        working-directory: contracts/payable_registry_v2_1

  verify-v3-module:
    name: v3 module == committed verifiable build (source archive, hash, node bytes, both books)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: source archive == repo source
        run: |
          set -e
          mkdir -p /tmp/v3 && tar -xf contracts/payable_registry_v3/verifiable/payable_registry_v3.wasm.v1.tar -C /tmp/v3
          for f in src/lib.rs Cargo.toml Cargo.lock tests/payable_v3.rs; do
            cmp contracts/payable_registry_v3/$f /tmp/v3/payable_registry_v3-0.1.0/$f && echo "same $f"
          done
      - name: module hash == deployed ref; node bytes == file; both v3 books run it
        working-directory: api
        run: npm ci --no-audit --no-fund && node scripts/verify-module.mjs

  verify-v3-build:
    name: v3 rebuild from source in Concordium's pinned image (cargo concordium verify-build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-concordium
          key: cargo-concordium-5.0.0
      - name: Install cargo-concordium 5.0.0
        run: command -v cargo-concordium || cargo install cargo-concordium --version 5.0.0 --locked
      - name: verify-build (rebuilds the committed archive in docker.io/concordium/verifiable-sc-wasm32v1:1)
        working-directory: contracts/payable_registry_v3
        run: cargo concordium verify-build --module verifiable/payable_registry_v3.wasm.v1 --source verifiable/payable_registry_v3.wasm.v1.tar
