# Verification-of-Payee census: re-run every 6 hours and commit the data (read-only against chains, no secrets, no transactions).
# /api/census serves tools/census/census_public.json from raw.githubusercontent.com (10 min cache), with the deploy-bundled copy as fallback.
name: census
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Drop caches and re-derive every badge/verdict'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: census
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh census (public data only)
        working-directory: tools/census
        env:
          FULL: ${{ inputs.full && '1' || '0' }}
        run: ./refresh.sh
      - name: Sanity-check the output before committing
        working-directory: tools/census
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('census_public.json'))
          for n in ('mainnet', 'testnet'):
              x = d['networks'][n]
              assert x['agents_total'] > 100, (n, x['agents_total'])
              assert 0 <= x['agents_that_pass_vop_today'] <= x['agents_total']
          assert d['check_payee_live_on_mainnet_payees']['accounts_checked'] > 50, 'mainnet check_payee returned too few accounts'
          assert d['check_payee_live_on_testnet_payees']['accounts_checked'] > 50
          print('ok', d['generated_at_utc'])
          PY
      - name: Commit data
        run: |
          git config user.name  "mohamedwael201193"
          git config user.email "72895329+mohamedwael201193@users.noreply.github.com"
          git add tools/census
          if git diff --cached --quiet; then echo "no data change"; exit 0; fi
          git commit -m "census: refresh $(date -u +%Y-%m-%dT%H:%MZ) [skip render]"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
