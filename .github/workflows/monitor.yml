# Keep-alive + badge-continuity monitor. Every 10 minutes: wake the API and the site, read GET /api/status
# (API, census freshness, the three PayOnce badges via the official check, registry, nodes). A red run means a required check failed
# (GitHub emails the repo owner). status/history.jsonl records only state CHANGES (incidents), committed with [skip render] [skip ci].
name: monitor
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: run
        run: node tools/census/monitor.mjs
        continue-on-error: true
      - name: Commit the incident history (only when the state changed)
        run: |
          git config user.name  "mohamedwael201193"
          git config user.email "72895329+mohamedwael201193@users.noreply.github.com"
          git add status/history.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then echo "no state change"; else
            git commit -m "status: $(tail -1 status/history.jsonl | cut -c1-120) [skip render] [skip ci]"
            for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep $((i*5)); done
          fi
      - name: Fail the run when a required check failed
        if: steps.run.outcome == 'failure'
        run: exit 1
